<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    마크는 제품의 동사를 그린다. 질문 하나가 갈라지고, 그중 하나를 골라 더 판다.

    16px에서도 읽혀야 해서 노드를 넷으로 묶었다. 다섯 개부터는 뭉개진다.
    오른쪽 가지만 아래로 한 칸 더 내려가는데, 갈래를 다 보는 게 아니라
    하나를 골라 파고든다는 뜻이다. 좌우가 대칭이면 그냥 삼각형으로 읽힌다.

    배경을 어두운 판으로 깐다. 브라우저 탭 색이 밝든 어둡든 청록이 뜨게 하려면
    투명 배경보다 이쪽이 안전하다.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0d1114" />
  <g stroke="#34c0ac" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M16 7.5 L9 17" />
    <path d="M16 7.5 L23 17" />
    <path d="M23 17 L23 26.5" />
  </g>
  <g fill="#34c0ac">
    <circle cx="16" cy="7.5" r="3" />
    <circle cx="9" cy="17" r="2.5" />
    <circle cx="23" cy="17" r="2.5" />
    <circle cx="23" cy="26.5" r="2.4" />
  </g>
</svg>
