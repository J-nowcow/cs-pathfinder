name: 오늘의 질문 발행

on:
  schedule:
    # UTC 21:13 = KST 다음 날 06:13.
    # 아침에 일어나면 이미 올라와 있게 한다.
    #
    # 정각을 피한 것은 GitHub Actions의 스케줄 큐가 매시 정각에 몰려
    # 수십 분씩 밀리기 때문이다. 밀리는 것을 감안해도 출근 전에 든다.
    - cron: '13 21 * * *'
  # 수동 실행. 발행이 밀렸거나 시드를 보충한 뒤 즉시 돌릴 때 쓴다.
  workflow_dispatch:

# 앞 실행이 아직 돌고 있으면 겹치지 않게 한다.
# 발행 자체는 하루 하나가 DB에서 보장되지만 LLM 호출을 두 번 태울 이유가 없다.
concurrency:
  group: publish-daily
  cancel-in-progress: false

# 목록 갱신 커밋을 밀어넣어야 한다. 발행 요청만 할 때는 필요 없던 권한이다.
permissions:
  contents: write

jobs:
  publish:
    name: POST /api/publish-daily
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 발행 요청
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # 시크릿이 비어 있으면 여기서 멈춘다.
          # 없는 채로 요청하면 401이 오고 원인이 인증인지 배포인지 안 보인다.
          : "${DEPLOY_URL:?DEPLOY_URL secret이 설정되지 않았다}"
          : "${CRON_SECRET:?CRON_SECRET secret이 설정되지 않았다}"

          # 실패하면 다시 던진다.
          #
          # 무료 한도가 마른 날에는 사슬 끝의 Gemma가 답하는데, 이 모델의
          # 응답 시간이 회차마다 10초와 120초 초과를 오간다. 실측에서 같은
          # 요청이 어떤 회차는 25초에 끝나고 어떤 회차는 시간 초과였다.
          # 한 번 던지고 마는 것과 세 번 던지는 것의 차이가 그날 질문이
          # 올라오느냐 마느냐다.
          #
          # 하루 하나는 DB가 보장하므로 재시도가 중복 발행을 만들지 않는다.
          # 이미 있으면 already_published로 즉시 돌아온다.
          #
          # --fail-with-body: 2xx가 아니면 본문을 찍고 종료 코드를 세운다.
          # 세 번 다 실패하면 워크플로가 빨간불로 끝난다. 조용히 넘어가면
          # 시드 소진도 생성 장애도 며칠 뒤에나 발견된다.
          for attempt in 1 2 3; do
            echo "시도 ${attempt}/3"
            if curl --fail-with-body -sS -X POST \
              --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "content-type: application/json" \
              "${DEPLOY_URL%/}/api/publish-daily"; then
              echo
              echo "발행 요청 성공 (시도 ${attempt})"
              exit 0
            fi
            echo
            # set -e 아래서는 `[ ... ] && sleep`이 마지막 회차에 거짓이 되어
            # 스크립트를 그 자리에서 끊는다. 아래 실패 메시지가 안 찍힌다
            if [ "${attempt}" -lt 3 ]; then sleep 30; fi
          done

          echo "세 번 모두 실패했다"
          exit 1

      # 레포에서도 질문 목록을 볼 수 있게 떠 놓는다.
      #
      # DB에 직접 붙지 않고 엔드포인트로 받는다. 직접 붙으려면 DATABASE_URL을
      # GitHub 시크릿에도 넣어야 하는데, DB 자격증명을 한 곳 더 늘리는 것보다
      # 이미 있는 CRON_SECRET을 쓰는 편이 낫다.
      #
      # 발행이 실패해도 여기는 돈다. 어제까지 올라온 것이라도 목록은 맞는 편이
      # 낫고, 발행 실패는 위 스텝이 이미 빨간불로 알린다.
      - name: 코드 받기
        if: always()
        uses: actions/checkout@v4

      - name: 질문 목록 받아 쓰기
        if: always()
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p cs

          # 임시 파일에 받고 성공했을 때만 옮긴다.
          #
          # 전에는 -o로 목적지에 바로 받았다. --fail-with-body는 실패해도 본문을
          # 내놓으므로, 401이나 503이 오면 그 에러 문자열이 질문 목록 파일을
          # 덮어썼다. 새벽에 사람 없이 도는 자리라 "unauthorized" 한 줄이 그대로
          # 커밋될 수 있었다.
          curl --fail-with-body -sS \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${DEPLOY_URL%/}/api/catalog" -o /tmp/questions.md

          # 빈 응답도 막는다. 200인데 내용이 없으면 목록을 지우는 것과 같다
          if [ ! -s /tmp/questions.md ]; then
            echo "목록이 비어 있다. 갱신하지 않는다"
            exit 1
          fi

          mv /tmp/questions.md cs/questions.md
          wc -l cs/questions.md

      # 앞 스텝이 실패했으면 여기는 안 돈다.
      #
      # 전에는 여기도 `if: always()`였다. 목록 받기가 실패해도 커밋을 시도했다는
      # 뜻이고, 위의 -o 문제와 겹치면 에러 본문이 커밋되는 길이 열려 있었다.
      # 받는 데 실패했으면 커밋할 것도 없다.
      - name: 바뀌었으면 커밋
        run: |
          set -euo pipefail

          # `git diff`가 아니라 `git status`를 본다.
          #
          # diff는 **추적되는** 파일의 변경만 본다. cs/questions.md는 한 번도
          # 커밋된 적이 없어 미추적이었고, 그래서 diff가 늘 "변화 없음"으로
          # 통과했다. 매 실행이 여기서 exit 0으로 빠져 git add에 닿은 적이 없다.
          # README가 링크하는 그 파일이 레포에 없는 이유가 이것이다.
          if [ -z "$(git status --porcelain -- cs/questions.md)" ]; then
            echo "목록에 변화 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs/questions.md
          git commit -m "chore: 질문 목록 갱신"
          git push
